version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: dermai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dermai_user
      POSTGRES_PASSWORD: dermai_secure_password
      POSTGRES_DB: dermai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dermai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dermai_user:dermai_secure_password@db:5432/dermai_db
      JWT_SECRET_KEY: super_secret_dermai_jwt_key_change_in_prod
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dermai_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
